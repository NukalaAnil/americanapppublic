name: Media transcoder CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.10.5"
  PLACEHOLDER_IMAGE: "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"

jobs:
  validate:
    name: Validate application and Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format Terraform
        run: terraform -chdir=terraform fmt -check -diff

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Build container image
        run: docker build --tag media-transcoder:${{ github.sha }} .

  deploy:
    name: Deploy to Azure
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialize Terraform
        run: >-
          terraform -chdir=terraform init -reconfigure
          -backend-config="use_oidc=true"
          -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}"
          -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}"
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=media-transcoder.tfstate"

      - name: Bootstrap Azure resources
        run: >-
          terraform -chdir=terraform apply -auto-approve
          -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          -var="resource_group_name=${{ vars.AZURE_RESOURCE_GROUP }}"
          -var="location=${{ vars.AZURE_LOCATION }}"
          -var="name=${{ vars.APP_NAME }}"
          -var="storage_account_name=${{ vars.AZURE_STORAGE_ACCOUNT }}"
          -var="registry_name=${{ vars.AZURE_CONTAINER_REGISTRY }}"
          -var="container_image=${{ env.PLACEHOLDER_IMAGE }}"

      - name: Build and push image in Azure Container Registry
        run: >-
          az acr build
          --registry "${{ vars.AZURE_CONTAINER_REGISTRY }}"
          --image "media-transcoder:${{ github.sha }}"
          .

      - name: Deploy application image
        run: >-
          terraform -chdir=terraform apply -auto-approve
          -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          -var="resource_group_name=${{ vars.AZURE_RESOURCE_GROUP }}"
          -var="location=${{ vars.AZURE_LOCATION }}"
          -var="name=${{ vars.APP_NAME }}"
          -var="storage_account_name=${{ vars.AZURE_STORAGE_ACCOUNT }}"
          -var="registry_name=${{ vars.AZURE_CONTAINER_REGISTRY }}"
          -var="container_image=${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/media-transcoder:${{ github.sha }}"

      - name: Show deployed API URL
        run: terraform -chdir=terraform output -raw api_url